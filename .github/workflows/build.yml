name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: TypeCheck
      run: bun x tsc --noEmit

    - name: Build
      run: bun run build

    - name: Test
      run: bun run test
