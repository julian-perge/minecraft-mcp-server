#:schema https://www.schemastore.org/prek.json
minimum_prek_version = "0.5.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  # tsconfig files are JSON with comments, which TypeScript and bun read, and check-json refuses.
  { id = "check-json", exclude = '^tsconfig(\.[a-z]+)?\.json$' },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  # Two trailing spaces in Markdown are a line break, so the hook keeps them in .md files.
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

# oxfmt and oxlint run from the versions that package.json pins, as in ~/code/julianperge_profile. The type check is bun's own checker, so it runs on the installed bun. It checks tsconfig.json, then tsconfig.test.json, which adds the tests.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
entry = "bun x oxfmt"
language = "system"
types_or = ["ts", "json"]

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "bun x oxlint --type-aware --deny-warnings"
language = "system"
types = ["ts"]

[[repos.hooks]]
id = "bun-check"
name = "bun check (types)"
entry = "bun run check:types"
language = "system"
types = ["ts"]
pass_filenames = false

# oxlint's jest plugin, when it is on, misses a focused test that imports from bun:test (a probe on 2026-11-19), so .oxlintrc.json leaves it off and this hook stops focused tests instead.
[[repos.hooks]]
id = "no-focused-tests"
name = "no focused tests"
entry = '\b(test|it|describe)\.only\('
language = "pygrep"
files = '^tests/'
